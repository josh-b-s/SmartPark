apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartpark-api
  labels:
    app: smartpark-api
spec:
  replicas: 1
  strategy:
    # Recreate instead of the RollingUpdate default: this cluster's small
    # nodes don't have spare capacity to run old and new pods side by side
    # briefly during a rollout. Recreate kills the old pod first, then
    # starts the new one, trading a few seconds of downtime for not
    # needing double capacity. Fine for dev/test, worth reconsidering for
    # anything closer to production.
    type: Recreate
  selector:
    matchLabels:
      app: smartpark-api
  template:
    metadata:
      labels:
        app: smartpark-api
    spec:
      # The init container downloads model.pt from GCS into a shared
      # emptyDir volume before the main container starts. This is the
      # cluster equivalent of the `-v ./model:/app/model` volume mount
      # used for local Docker testing: the model still isn't baked into
      # the image, so swapping it means re-uploading to GCS and restarting
      # the deployment, not rebuilding/pushing a new image.
      initContainers:
        - name: fetch-model
          image: google/cloud-sdk:slim
          command:
            - sh
            - -c
            - "gsutil cp gs://smartpark-fit3184-508304-smartpark-model/model.pt /model/model.pt"
          volumeMounts:
            - name: model-volume
              mountPath: /model
      containers:
        - name: smartpark-api
          # Replace with your actual pushed image if you used a different
          # tag than :latest.
          image: australia-southeast1-docker.pkg.dev/smartpark-fit3184-508304/smartpark-repo/smartpark-api:latest
          ports:
            - containerPort: 8000
          # Car park count, caching and refresh settings live in the
          # smartpark-config ConfigMap (k8s/configmap.yaml).
          envFrom:
            - configMapRef:
                name: smartpark-config
          env:
            - name: SMARTPARK_MODEL_PATH
              value: /app/model/model.pt
          volumeMounts:
            - name: model-volume
              mountPath: /app/model
          # Sized for e2-standard-4 nodes (4 vCPU / 16GB each): request is
          # deliberately small so many pods can schedule, limit lets a
          # single pod burst to use a whole node's cores under load. See
          # the benchmark report for how these values were arrived at
          # (CPU limit and machine type both measurably affect latency).
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: model-volume
          emptyDir: {}
